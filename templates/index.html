<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Reading Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Web Reading Assistant</h1>
      <p class="subtitle">Search the web or paste a URL to summarize a page.</p>
    </header>

    <section class="controls">
      <div class="settings-row">
        <label class="field">
          <span class="field-label">Provider</span>
          <select id="provider">
            <option value="auto">Auto (first available key)</option>
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai">OpenAI</option>
            <option value="qwen">Qwen (DashScope)</option>
            <option value="deepseek">DeepSeek</option>
            <option value="extractive">Extractive (no AI)</option>
          </select>
        </label>
        <label class="field field-grow">
          <span class="field-label">Model ID</span>
          <input id="model" type="text" list="model-suggestions" placeholder="auto" autocomplete="off" />
          <datalist id="model-suggestions"></datalist>
        </label>
        <span id="providerStatus" class="provider-status"></span>
      </div>

      <div class="input-row">
        <input
          id="query"
          type="text"
          placeholder="Type a search query, or paste a URL to summarize…"
          autocomplete="off"
          autofocus
        />
        <button id="searchBtn" class="btn btn-primary">Search</button>
        <button id="summarizeBtn" class="btn btn-secondary">Summarize</button>
      </div>
      <p class="hint">
        Tip: Press <kbd>Enter</kbd> to search, <kbd>Shift</kbd>+<kbd>Enter</kbd> to summarize.
        The model field accepts any model ID the provider supports.
      </p>
    </section>

    <section id="status" class="status hidden"></section>
    <section id="results" class="results"></section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
